<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">HABC stress, affect, and activity recognition architecture</title>
  <desc id="desc">A parallel CNN and BiLSTM with attention architecture feeding feature fusion and classification, with cross-dataset accuracy results.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#111111" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#111111"/>
    </marker>
  </defs>

  <rect width="1200" height="650" fill="#faf8e8"/>
  <path d="M0 18 H1200" stroke="#111111" stroke-width="4"/>
  <circle cx="1132" cy="74" r="31" fill="#f8b4c8" stroke="#111111" stroke-width="4"/>
  <path d="M1132 51 V97 M1109 74 H1155 M1116 58 L1148 90 M1148 58 L1116 90" stroke="#111111" stroke-width="3"/>

  <text x="64" y="82" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#111111">DEEP LEARNING CASE STUDY</text>
  <text x="64" y="140" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="900" fill="#111111">HABC</text>
  <rect x="260" y="99" width="500" height="52" fill="#f8df6d" stroke="#111111" stroke-width="4"/>
  <text x="279" y="137" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#111111">STRESS • AFFECT • ACTIVITY</text>
  <text x="66" y="177" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#404040">Parallel spatial + temporal learning from multimodal sensor data</text>

  <g filter="url(#shadow)">
    <rect x="64" y="246" width="174" height="104" rx="8" fill="#ffffff" stroke="#111111" stroke-width="4"/>
    <text x="151" y="287" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111111">SENSOR</text>
    <text x="151" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111111">SEQUENCES</text>
    <text x="151" y="337" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#555555">ECG • EDA • HRV • ACC</text>
  </g>

  <path d="M238 298 H291 V253 H330" fill="none" stroke="#111111" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M238 298 H291 V391 H330" fill="none" stroke="#111111" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="342" y="206" width="262" height="102" rx="8" fill="#dff3df" stroke="#111111" stroke-width="4" transform="rotate(-1 342 206)"/>
    <text x="473" y="248" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="900" fill="#111111">CNN BRANCH</text>
    <text x="473" y="279" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#333333">LOCAL / SPATIAL FEATURES</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="342" y="345" width="262" height="102" rx="8" fill="#e5d9f7" stroke="#111111" stroke-width="4" transform="rotate(1 342 345)"/>
    <text x="473" y="386" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="900" fill="#111111">BiLSTM + ATTENTION</text>
    <text x="473" y="417" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#333333">TEMPORAL DEPENDENCIES</text>
  </g>

  <path d="M607 257 H660 V326 H703" fill="none" stroke="#111111" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M607 396 H660 V326 H703" fill="none" stroke="#111111" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="715" y="268" width="190" height="116" rx="58" fill="#bfe5fa" stroke="#111111" stroke-width="4"/>
    <text x="810" y="317" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="#111111">FEATURE</text>
    <text x="810" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="#111111">FUSION</text>
  </g>

  <path d="M907 326 H955" fill="none" stroke="#111111" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="969" y="244" width="169" height="164" rx="8" fill="#f8b4c8" stroke="#111111" stroke-width="4" transform="rotate(1 969 244)"/>
    <text x="1054" y="293" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#111111">CLASSIFY</text>
    <path d="M1002 315 H1106" stroke="#111111" stroke-width="3"/>
    <text x="1054" y="342" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111111">STRESS</text>
    <text x="1054" y="366" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111111">AFFECT</text>
    <text x="1054" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111111">ACTIVITY</text>
  </g>

  <path d="M64 491 H1138" stroke="#111111" stroke-width="4"/>
  <text x="64" y="532" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" letter-spacing="2" fill="#111111">CROSS-DATASET ACCURACY</text>

  <g font-family="Arial, Helvetica, sans-serif" fill="#111111">
    <rect x="64" y="554" width="247" height="61" rx="7" fill="#ffffff" stroke="#111111" stroke-width="3"/>
    <text x="84" y="580" font-size="15" font-weight="800">WESAD</text>
    <text x="286" y="597" text-anchor="end" font-size="27" font-weight="900">96.63%</text>

    <rect x="326" y="554" width="247" height="61" rx="7" fill="#ffffff" stroke="#111111" stroke-width="3"/>
    <text x="346" y="580" font-size="15" font-weight="800">MUSE</text>
    <text x="548" y="597" text-anchor="end" font-size="27" font-weight="900">95.29%</text>

    <rect x="588" y="554" width="247" height="61" rx="7" fill="#ffffff" stroke="#111111" stroke-width="3"/>
    <text x="608" y="580" font-size="15" font-weight="800">SWELL-KW</text>
    <text x="810" y="597" text-anchor="end" font-size="27" font-weight="900">98.78%</text>

    <rect x="850" y="554" width="288" height="61" rx="7" fill="#ffffff" stroke="#111111" stroke-width="3"/>
    <text x="870" y="580" font-size="15" font-weight="800">UTD-MHAD</text>
    <text x="1113" y="597" text-anchor="end" font-size="27" font-weight="900">93.33%</text>
  </g>
</svg>
